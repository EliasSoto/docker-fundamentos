services:

  # Servicio Frontend: interfaz de usuario.
  frontend:
    # Construye la imagen utilizando el Dockerfile del directorio actual.
    build: .
    # Conecta el contenedor a la red red_elias.
    networks:
      - red_elias

  # Servicio API: procesa las solicitudes del Frontend.
  api:
    # Construye la imagen utilizando el mismo Dockerfile.
    build: .
    # Conecta el contenedor a la red red_elias.
    networks:
      - red_elias

  # Servicio PostgreSQL: almacena y gestiona los datos.
  postgres:
    # Utiliza la imagen oficial de PostgreSQL versión 17.
    image: postgres:17

    # Configura la contraseña del usuario postgres.
    environment:
      POSTGRES_PASSWORD: ejemplo

    # Monta un volumen para conservar los datos de la base de datos.
    volumes:
      - datos_postgres:/var/lib/postgresql/data

    # Conecta PostgreSQL a la red red_elias.
    networks:
      - red_elias


# Define la red virtual que permite la comunicación entre los servicios.
networks:
  red_elias:
    # Establece el nombre exacto de la red en Docker.
    name: red_elias


# Define los volúmenes persistentes administrados por Docker.
volumes:
  # Conserva los datos de PostgreSQL aunque se elimine su contenedor.
  datos_postgres: